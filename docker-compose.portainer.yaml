services:
    backend:
        image: ghcr.io/unimed-leste-paulista/task-fornecedores:1.0.0
        env_file:
            - stack.env
        deploy:
            resources:
                limits:
                    memory: 1g
                    cpus: "2.0"
        volumes:
            - /opt/oracle:/opt/oracle
        restart: always